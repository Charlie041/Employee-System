<!DOCTYPE html>
<html>
<head>
    <title>Employee List</title>
    <link rel="stylesheet" href="Design.css">
</head>
<body>

<div class="layout">

    <div class="sidebar">
        <h2>Employee<br>System</h2>

        <a href="Homepage.html">Dashboard</a>
        <a href="employee.html" class="active">Employees</a>
        <a href="attendance.html">Attendance</a>
        <a href="salary.html">Salary</a>
      

        <br><br><br><br><br><br><br><br>

        <a href="settings.html">Settings</a>
        <a href="dashboard.html">Logout</a>
    </div>

    <div class="main">

        <div class="top">
            <input type="text" id="Search"
                   placeholder="Search employee">
            <span>Admin</span>
        </div>

        <h1>Employee List</h1>
        
        <button class="add-button">
            Add Employee +
        </button>
    
        <div class="filters">
            <select id="DepartmentFilter">
                <option value="">All Departments</option>
                <option value="Washing">Washing</option>
                <option value="Drying">Drying</option>
                <option value="Packing">Packing</option>
                <option value="Delivery">Delivery</option>
            </select>

            <select id="PositionFilter">
                <option value="">All Positions</option>
                <option value="Regular">Regular</option>
                <option value="Part Time">Part Time</option>
            </select>

            <select id="StatusFilter">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="EmployeeTable"></tbody>
        </table>

    </div>
</div>

<script>
    var savedData = localStorage.getItem("employees_db");

    if (savedData == null) {
        var employees = [];
    } else {
        var employees = JSON.parse(savedData);
    }

    function SaveEmployees() {
        localStorage.setItem(
            "employees_db",
            JSON.stringify(employees)
        );
    }

    function DisplayEmployees(data) {
        var table = "";

        for (var i = 0; i < data.length; i++) {
            var index = employees.indexOf(data[i]);

            table += "<tr>";
            table += "<td>" + data[i].Id + "</td>";
            table += "<td>" + data[i].Name + "</td>";
            table += "<td>" + data[i].Department + "</td>";
            table += "<td>" + data[i].Position + "</td>";
            table += "<td>" + data[i].EmployeeStatus + "</td>";

            table += "<td>";
            table += '<button class="action-button view-button" onclick="ViewEmployee(' + index + ')">View</button>';
            table += '<button class="action-button edit-button" onclick="EditEmployee(' + index + ')">Edit</button>';
            table += '<button class="action-button delete-button" onclick="DeleteEmployee(' + index + ')">Delete</button>';
            table += "</td>";

            table += "</tr>";
        }

        document.getElementById("EmployeeTable").innerHTML = table;
    }

    function FilterEmployees() {
        var search = document.getElementById("Search").value.toLowerCase();
        var department = document.getElementById("DepartmentFilter").value;
        var position = document.getElementById("PositionFilter").value;
        var status = document.getElementById("StatusFilter").value;

        var result = [];

        for (var i = 0; i < employees.length; i++) {
            var name = employees[i].Name.toLowerCase();
            var dept = employees[i].Department;
            var pos = employees[i].Position || "";
            var empStatus = employees[i].EmployeeStatus || "Active";

            if (
                (name.includes(search) ||
                 employees[i].Id.toLowerCase().includes(search)) &&
                (department == "" || dept == department) &&
                (position == "" || pos == position) &&
                (status == "" || empStatus == status)
            ) {
                result.push(employees[i]);
            }
        }

        DisplayEmployees(result);
    }

    function ViewEmployee(index) {
        var emp = employees[index];

        alert(
            "Employee ID: " + emp.Id +
            "\nName: " + emp.Name +
            "\nDepartment: " + emp.Department +
            "\nPosition: " + (emp.Position || "Not set") +
            "\nSalary: ₱" + Number(emp.Salary).toLocaleString("en-PH") +
            "\nStatus: " + (emp.EmployeeStatus || "Active")
        );
    }

    function EditEmployee(index) {
        var emp = employees[index];

        var name = prompt("Employee Name:", emp.Name);
        if (name == null || name.trim() == "") return;

        var department = prompt("Department:", emp.Department);
        if (department == null || department.trim() == "") return;

        var position = prompt("Position:", emp.Position || "Regular");
        if (position == null || position.trim() == "") return;

        var status = prompt("Employee Status (Active or Inactive):",
                            emp.EmployeeStatus || "Active");

        if (status == null || status.trim() == "") return;

        emp.Name = name.trim();
        emp.Department = department.trim();
        emp.Position = position.trim();
        emp.EmployeeStatus = status.trim();

        SaveEmployees();
        FilterEmployees();
    }

    function DeleteEmployee(index) {
        if (confirm("Are you sure you want to delete this employee?")) {
            employees.splice(index, 1);
            SaveEmployees();
            FilterEmployees();
        }
    }

    document.getElementById("Search").oninput = FilterEmployees;
    document.getElementById("DepartmentFilter").onchange = FilterEmployees;
    document.getElementById("PositionFilter").onchange = FilterEmployees;
    document.getElementById("StatusFilter").onchange = FilterEmployees;

    DisplayEmployees(employees);
</script>

</body>
</html>
